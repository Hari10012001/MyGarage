<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Categories — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <!-- Canonical Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: adminSidebar('admin-categories')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/topbar :: topbar('Vehicle Categories')}"></div>
        <div class="page-content px-4 pb-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mt-3"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-3"><span th:text="${errorMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <div class="row mt-4 g-4">
                <!-- Categories Table -->
                <div class="col-lg-8">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0">Vehicle Categories</h4>
                    </div>
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light"><tr><th>Icon</th><th>Category Name</th><th>Vehicles</th><th>Actions</th></tr></thead>
                                    <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td class="fs-4" th:text="${cat.icon}">🚗</td>
                                        <td class="fw-semibold" th:text="${cat.name}">Name</td>
                                        <td><span class="badge bg-primary-subtle text-primary" th:text="${cat.vehicles?.size() ?: 0}">0</span></td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary me-1"
                                                    data-bs-toggle="modal" data-bs-target="#editModal"
                                                    th:data-id="${cat.categoryId}"
                                                    th:data-name="${cat.name}"
                                                    th:data-icon="${cat.icon}"
                                                    onclick="openEditModal(this.getAttribute('data-id'), this.getAttribute('data-name'), this.getAttribute('data-icon'))">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <form th:action="@{/admin/categories/{id}/delete(id=${cat.categoryId})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                                        onclick="return confirm('Delete this category?')"><i class="bi bi-trash"></i></button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Category -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 pt-4"><h6 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-success"></i>Add Category</h6></div>
                        <div class="card-body">
                            <form th:action="@{/admin/categories/add}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
                                    <input type="text" name="name" class="form-control" placeholder="e.g. Electric Car" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Icon (emoji)</label>
                                    <input type="text" name="icon" class="form-control" placeholder="e.g. ⚡" maxlength="10">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Description</label>
                                    <textarea name="description" class="form-control" rows="2"></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100"><i class="bi bi-plus-circle me-1"></i>Add Category</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Category Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0"><h5 class="modal-title fw-bold">Edit Category</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="editCatForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label fw-semibold">Name</label><input type="text" id="editName" name="name" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Icon</label><input type="text" id="editIcon" name="icon" class="form-control" maxlength="10"></div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
