<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <!-- Canonical Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: adminSidebar('admin-dashboard')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/topbar :: topbar('Admin Dashboard')}"></div>
        <div class="page-content px-4 pb-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mt-3"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-3"><span th:text="${errorMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <h4 class="fw-bold mt-4 mb-4">System Overview</h4>

            <!-- Admin Stats -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-lg-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-3">
                            <div class="stat-icon text-primary mb-2"><i class="bi bi-people fs-2"></i></div>
                            <div class="stat-number fw-bold fs-2" th:text="${totalUsers}">0</div>
                            <div class="stat-label text-muted small">Registered Users</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-3">
                            <div class="stat-icon text-success mb-2"><i class="bi bi-car-front fs-2"></i></div>
                            <div class="stat-number fw-bold fs-2" th:text="${totalVehicles}">0</div>
                            <div class="stat-label text-muted small">Total Vehicles</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-3">
                            <div class="stat-icon text-warning mb-2"><i class="bi bi-tools fs-2"></i></div>
                            <div class="stat-number fw-bold fs-2" th:text="${totalServiceRecords}">0</div>
                            <div class="stat-label text-muted small">Service Records</div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <div class="stat-card card border-0 shadow-sm h-100">
                        <div class="card-body text-center p-3">
                            <div class="stat-icon text-danger mb-2"><i class="bi bi-fuel-pump fs-2"></i></div>
                            <div class="stat-number fw-bold fs-2" th:text="${totalFuelRecords}">0</div>
                            <div class="stat-label text-muted small">Fuel Records</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Recent users -->
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 d-flex justify-content-between pt-3">
                            <h6 class="fw-bold mb-0"><i class="bi bi-people me-2 text-primary"></i>Recent Users</h6>
                            <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-primary">Manage All</a>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light"><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead>
                                    <tbody>
                                    <tr th:each="u : ${recentUsers}">
                                        <td th:text="${u.fullName}">Name</td>
                                        <td><span class="text-muted small" th:text="${u.email}">email</span></td>
                                        <td><span th:classappend="${u.active} ? 'bg-success' : 'bg-secondary'" class="badge" th:text="${u.active ? 'Active' : 'Disabled'}">Status</span></td>
                                    </tr>
                                    <tr th:if="${recentUsers == null or recentUsers.isEmpty()}">
                                        <td colspan="3" class="text-center text-muted py-3">No users yet.</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Categories summary -->
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 d-flex justify-content-between pt-3">
                            <h6 class="fw-bold mb-0"><i class="bi bi-tags me-2 text-success"></i>Vehicle Categories</h6>
                            <a th:href="@{/admin/categories}" class="btn btn-sm btn-outline-success">Manage</a>
                        </div>
                        <div class="card-body p-0">
                            <ul class="list-group list-group-flush">
                                <li th:each="cat : ${categories}" class="list-group-item d-flex justify-content-between align-items-center px-3 py-2">
                                    <span><span th:text="${cat.icon}">🚗</span> <span th:text="${cat.name}">Category</span></span>
                                    <span class="badge bg-primary-subtle text-primary">Active</span>
                                </li>
                                <li th:if="${categories == null or categories.isEmpty()}" class="list-group-item text-muted text-center py-3">No categories.</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
