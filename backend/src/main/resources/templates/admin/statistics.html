<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Statistics — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar-overlay d-lg-none" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav id="sidebar" class="sidebar d-flex flex-column">
        <div class="sidebar-brand"><i class="bi bi-car-front-fill me-2"></i>MyGarage</div>
        <ul class="nav flex-column sidebar-nav flex-grow-1">
            <li class="sidebar-section-label">ADMIN</li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/admin/dashboard}"><i class="bi bi-bar-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/admin/users}"><i class="bi bi-people"></i> Users</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Categories</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link active" th:href="@{/admin/statistics}"><i class="bi bi-graph-up"></i> Statistics</a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-left"></i> Logout</button></form></div>
    </nav>
    <div class="main-content flex-grow-1">
        <nav class="topbar navbar navbar-light bg-white border-bottom px-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
            <span class="fw-semibold">System Statistics</span>
            <div class="ms-auto"><span class="badge bg-danger me-2">ADMIN</span><span class="small text-muted" th:text="${user?.fullName}"></span></div>
        </nav>
        <div class="page-content px-4 pb-4">
            <h4 class="fw-bold mt-4 mb-4">System Statistics</h4>
            <div class="row g-3 mb-4">
                <div class="col-6 col-lg-4">
                    <div class="stat-card card border-0 shadow-sm text-center p-3">
                        <i class="bi bi-people fs-2 text-primary mb-2 d-block"></i>
                        <div class="fw-bold fs-2" th:text="${totalUsers}">0</div>
                        <div class="text-muted small">Registered Users</div>
                    </div>
                </div>
                <div class="col-6 col-lg-4">
                    <div class="stat-card card border-0 shadow-sm text-center p-3">
                        <i class="bi bi-car-front fs-2 text-success mb-2 d-block"></i>
                        <div class="fw-bold fs-2" th:text="${totalVehicles}">0</div>
                        <div class="text-muted small">Total Vehicles</div>
                    </div>
                </div>
                <div class="col-6 col-lg-4">
                    <div class="stat-card card border-0 shadow-sm text-center p-3">
                        <i class="bi bi-tools fs-2 text-warning mb-2 d-block"></i>
                        <div class="fw-bold fs-2" th:text="${totalServiceRecords}">0</div>
                        <div class="text-muted small">Service Records</div>
                    </div>
                </div>
                <div class="col-6 col-lg-4">
                    <div class="stat-card card border-0 shadow-sm text-center p-3">
                        <i class="bi bi-fuel-pump fs-2 text-danger mb-2 d-block"></i>
                        <div class="fw-bold fs-2" th:text="${totalFuelRecords}">0</div>
                        <div class="text-muted small">Fuel Records</div>
                    </div>
                </div>
                <div class="col-6 col-lg-4">
                    <div class="stat-card card border-0 shadow-sm text-center p-3">
                        <i class="bi bi-calendar-check fs-2 text-info mb-2 d-block"></i>
                        <div class="fw-bold fs-2" th:text="${totalMaintenanceRecords}">0</div>
                        <div class="text-muted small">Maintenance Records</div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-3"><h6 class="fw-bold mb-0">Vehicle Category Breakdown</h6></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light"><tr><th>Icon</th><th>Category</th><th>Vehicles</th></tr></thead>
                            <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.icon}">🚗</td>
                                <td th:text="${cat.name}">Category</td>
                                <td><span class="badge bg-primary-subtle text-primary" th:text="${cat.vehicles?.size() ?: 0}">0</span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
