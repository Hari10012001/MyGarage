<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar-overlay d-lg-none" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav id="sidebar" class="sidebar d-flex flex-column">
        <div class="sidebar-brand"><i class="bi bi-car-front-fill me-2"></i>MyGarage</div>
        <ul class="nav flex-column sidebar-nav flex-grow-1">
            <li class="sidebar-section-label">ADMIN</li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/admin/dashboard}"><i class="bi bi-bar-chart-line"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link active" th:href="@{/admin/users}"><i class="bi bi-people"></i> Users</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Categories</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/admin/statistics}"><i class="bi bi-graph-up"></i> Statistics</a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-left"></i> Logout</button></form></div>
    </nav>
    <div class="main-content flex-grow-1">
        <nav class="topbar navbar navbar-light bg-white border-bottom px-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
            <span class="fw-semibold">User Management</span>
            <div class="ms-auto"><span class="badge bg-danger me-2">ADMIN</span><span class="small text-muted" th:text="${user?.fullName}"></span></div>
        </nav>
        <div class="page-content px-4 pb-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mt-3"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-3"><span th:text="${errorMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                <h4 class="fw-bold mb-0">Registered Users</h4>
                <span class="badge bg-primary" th:text="${users?.size() ?: 0} + ' users'">0</span>
            </div>

            <!-- Search Form -->
            <form th:action="@{/admin/users}" method="get" class="mb-3">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="search" th:value="${search}" class="form-control border-start-0 ps-0" placeholder="Search users by name or email...">
                    <button class="btn btn-primary" type="submit">Search</button>
                    <a th:if="${search != null and !search.isBlank()}" th:href="@{/admin/users}" class="btn btn-outline-secondary">Clear</a>
                </div>
            </form>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Status</th><th>Action</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="u, stat : ${users}">
                                <td class="text-muted" th:text="${stat.count}">1</td>
                                <td class="fw-semibold" th:text="${u.fullName}">Name</td>
                                <td><span class="text-muted small" th:text="${u.email}">email</span></td>
                                <td><span class="text-muted small" th:text="${u.phone ?: '—'}">—</span></td>
                                <td><span class="small" th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'dd MMM yyyy') : '—'}">Date</span></td>
                                <td><span th:classappend="${u.active} ? 'bg-success' : 'bg-secondary'" class="badge" th:text="${u.active ? 'Active' : 'Disabled'}">Status</span></td>
                                <td>
                                    <form th:action="@{/admin/users/{id}/toggle(id=${u.userId})}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" class="btn btn-sm"
                                                th:classappend="${u.active} ? 'btn-outline-warning' : 'btn-outline-success'"
                                                th:text="${u.active ? 'Disable' : 'Enable'}">Toggle</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${users == null or users.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">No users registered yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
