<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100">
<div class="auth-card card shadow-lg p-4" style="width: 420px; max-width: 95vw;">
    <!-- Brand -->
    <div class="text-center mb-4">
        <a href="/" class="text-decoration-none">
            <div class="brand-icon mx-auto mb-2">
                <i class="bi bi-car-front-fill fs-1 text-primary"></i>
            </div>
            <h4 class="fw-bold text-primary-dark">MyGarage</h4>
        </a>
        <p class="text-muted small">Welcome back! Log in to your garage.</p>
    </div>

    <!-- Alerts -->
    <div th:if="${errorMsg}" class="alert alert-danger py-2">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${logoutMsg}" class="alert alert-success py-2">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${logoutMsg}"></span>
    </div>
    <div th:if="${successMsg}" class="alert alert-success py-2">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}"></span>
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="you@example.com" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Your password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login to MyGarage
            </button>
        </div>
    </form>

    <div class="text-center">
        <p class="text-muted small">Don't have an account?
            <a href="/register" class="text-primary fw-semibold text-decoration-none">Register here</a>
        </p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
