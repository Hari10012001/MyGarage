<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
<div class="text-center p-5 card border-0 shadow-sm" style="max-width: 520px;">
    <div class="mb-3">
        <i class="bi bi-shield-x text-danger display-1"></i>
    </div>
    <h3 class="fw-bold text-danger">403 — Access Denied</h3>
    <p class="text-muted mb-4">
        You do not have sufficient permissions to access this page or perform this operation.
        Administrative privileges are required for system management routes.
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a href="/dashboard" class="btn btn-primary">
            <i class="bi bi-speedometer2 me-1"></i>User Dashboard
        </a>
        <a href="/admin/dashboard" class="btn btn-outline-danger">
            <i class="bi bi-shield-lock me-1"></i>Admin Portal
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Go Back
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
