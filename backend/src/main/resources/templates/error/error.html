<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle ?: 'Error'} + ' — MyGarage'">Error — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
<div class="text-center p-5">
    <i class="bi bi-exclamation-triangle-fill text-warning display-1 mb-3 d-block"></i>
    <h3 class="fw-bold" th:text="${errorTitle ?: 'Something went wrong'}">Error</h3>
    <p class="text-muted mb-4" th:text="${errorMessage ?: 'An unexpected error occurred.'}">Message</p>
    <a href="/dashboard" class="btn btn-primary me-2"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
