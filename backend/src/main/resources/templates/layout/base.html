<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — MyGarage' : 'MyGarage'}">MyGarage</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- MyGarage Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<div class="d-flex">
    <!-- Canonical Sidebar Fragment -->
    <sec:authorize access="hasRole('ADMIN')">
        <div th:replace="~{fragments/sidebar :: adminSidebar(${activePage})}"></div>
    </sec:authorize>
    <sec:authorize access="!hasRole('ADMIN')">
        <div th:replace="~{fragments/sidebar :: userSidebar(${activePage})}"></div>
    </sec:authorize>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/topbar :: topbar(${pageTitle})}"></div>

        <!-- Flash Messages -->
        <div class="px-4 pt-3">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- Page Content (injected by child templates) -->
        <div class="page-content px-4 pb-4">
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
