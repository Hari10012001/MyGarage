<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar-overlay d-lg-none" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav id="sidebar" class="sidebar d-flex flex-column">
        <div class="sidebar-brand"><i class="bi bi-car-front-fill me-2"></i>MyGarage</div>
        <ul class="nav flex-column sidebar-nav flex-grow-1">
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles}"><i class="bi bi-car-front"></i> My Vehicles</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles/fuel-analytics}"><i class="bi bi-fuel-pump"></i> Fuel Intelligence</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link active" th:href="@{/profile}"><i class="bi bi-person-circle"></i> My Profile</a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-left"></i> Logout</button></form></div>
    </nav>
    <div class="main-content flex-grow-1">
        <nav class="topbar navbar navbar-light bg-white border-bottom px-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
            <span class="fw-semibold">My Profile</span>
            <div class="ms-auto"><i class="bi bi-person-circle me-2 text-primary"></i><span class="small text-muted" th:text="${user?.fullName}"></span></div>
        </nav>
        <div class="page-content px-4 pb-4">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mt-3"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-3"><span th:text="${errorMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div th:if="${passwordSuccess}" class="alert alert-success alert-dismissible fade show mt-3"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${passwordSuccess}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div th:if="${passwordError}" class="alert alert-danger alert-dismissible fade show mt-3"><span th:text="${passwordError}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <h4 class="fw-bold mt-4 mb-4">My Profile</h4>
            <div class="row g-4">
                <!-- Profile Info -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-white border-0 pt-4"><h6 class="fw-bold mb-0"><i class="bi bi-person-fill me-2 text-primary"></i>Profile Information</h6></div>
                        <div class="card-body px-4">
                            <div class="text-center mb-4">
                                <div class="profile-avatar mx-auto mb-2"><i class="bi bi-person-circle display-4 text-primary"></i></div>
                                <div class="fw-bold fs-5" th:text="${user?.fullName}">Name</div>
                                <div class="text-muted small" th:text="${user?.email}">Email</div>
                                <span class="badge bg-primary mt-1" th:text="${user?.role?.name()?.replace('_', ' ')}">Role</span>
                            </div>
                            <form th:action="@{/profile/update}" th:object="${profileRequest}" method="post" novalidate>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control bg-light" th:value="${user?.email}" readonly>
                                    <div class="form-text text-muted">Email cannot be changed.</div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Phone</label>
                                    <input type="text" th:field="*{phone}" class="form-control" placeholder="10-digit mobile number">
                                </div>
                                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save me-1"></i>Save Changes</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Change Password -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-white border-0 pt-4"><h6 class="fw-bold mb-0"><i class="bi bi-shield-lock me-2 text-warning"></i>Change Password</h6></div>
                        <div class="card-body px-4">
                            <form th:action="@{/profile/change-password}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Current Password</label>
                                    <input type="password" name="currentPassword" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">New Password</label>
                                    <input type="password" name="newPassword" class="form-control" required minlength="6" placeholder="Min. 6 characters">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Confirm New Password</label>
                                    <input type="password" name="confirmNewPassword" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-warning w-100 text-dark"><i class="bi bi-key me-1"></i>Update Password</button>
                            </form>
                            <div class="mt-4">
                                <div class="fw-semibold small mb-2 text-muted">Account Details</div>
                                <div class="row g-2 text-muted small">
                                    <div class="col-6">Joined:</div>
                                    <div class="col-6 text-end" th:text="${user?.createdAt != null ? #temporals.format(user.createdAt, 'dd MMM yyyy') : '—'}">Date</div>
                                    <div class="col-6">Account Status:</div>
                                    <div class="col-6 text-end"><span class="badge bg-success">Active</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
