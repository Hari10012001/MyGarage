<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${serviceId != null ? 'Edit Service' : 'Add Service'} + ' — MyGarage'">Service — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar-overlay d-lg-none" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav id="sidebar" class="sidebar d-flex flex-column">
        <div class="sidebar-brand"><i class="bi bi-car-front-fill me-2"></i>MyGarage</div>
        <ul class="nav flex-column sidebar-nav flex-grow-1">
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link active" th:href="@{/vehicles}"><i class="bi bi-car-front"></i> My Vehicles</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles/reliability}"><i class="bi bi-shield-check"></i> Reliability Index</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles/dispatch}"><i class="bi bi-geo-alt-fill"></i> Trip Dispatch</a></li>

            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles/fuel-analytics}"><i class="bi bi-fuel-pump"></i> Fuel Intelligence</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles/reliability}"><i class="bi bi-shield-check"></i> Reliability Index</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/vehicles/dispatch}"><i class="bi bi-geo-alt-fill"></i> Trip Dispatch</a></li>

            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/profile}"><i class="bi bi-person-circle"></i> My Profile</a></li>
        </ul>
        <div class="sidebar-footer"><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-left"></i> Logout</button></form></div>
    </nav>
    <div class="main-content flex-grow-1">
        <nav class="topbar navbar navbar-light bg-white border-bottom px-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
            <span class="fw-semibold" th:text="${serviceId != null ? 'Edit Service Record' : 'Add Service Record'}">Service</span>
            <div class="ms-auto"><i class="bi bi-person-circle me-2 text-primary"></i><span class="small text-muted" th:text="${user?.fullName}"></span></div>
        </nav>
        <div class="page-content px-4 pb-4">
            <div th:if="${errorMsg}" class="alert alert-danger mt-3"><span th:text="${errorMsg}"></span></div>
            <div class="row justify-content-center mt-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 pt-4 px-4">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-tools fs-4 text-success"></i>
                                <div>
                                    <h5 class="fw-bold mb-0" th:text="${serviceId != null ? 'Edit Service Record' : 'Log Service Record'}">Service</h5>
                                    <p class="text-muted small mb-0" th:if="${vehicle != null}" th:text="${vehicle.displayName + ' — ' + vehicle.plateNumber}">Vehicle</p>
                                </div>
                            </div>
                        </div>
                        <div class="card-body px-4 pb-4">
                            <form th:action="${serviceId != null ? '/vehicles/' + vehicle.vehicleId + '/services/' + serviceId + '/edit' : '/vehicles/' + vehicle.vehicleId + '/services/add'}"
                                  th:object="${serviceRequest}" method="post" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Service Date <span class="text-danger">*</span></label>
                                        <input type="date" th:field="*{serviceDate}" class="form-control" th:classappend="${#fields.hasErrors('serviceDate')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('serviceDate')}" th:errors="*{serviceDate}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Service Type <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{serviceType}" class="form-control"
                                               th:classappend="${#fields.hasErrors('serviceType')} ? 'is-invalid'"
                                               placeholder="e.g. Oil Change, Tyre Rotation">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('serviceType')}" th:errors="*{serviceType}"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Description</label>
                                        <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Work done during this service..."></textarea>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Garage / Service Center</label>
                                        <input type="text" th:field="*{garageName}" class="form-control" placeholder="e.g. XYZ Service Center">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Cost (₹)</label>
                                        <div class="input-group">
                                            <span class="input-group-text">₹</span>
                                            <input type="number" th:field="*{cost}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('cost')} ? 'is-invalid'"
                                                   step="0.01" min="0" placeholder="0.00">
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Odometer at Service (km)</label>
                                        <div class="input-group">
                                            <input type="number" th:field="*{odometerAtService}" class="form-control" min="0" placeholder="e.g. 24000">
                                            <span class="input-group-text">km</span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Next Service Due Date</label>
                                        <input type="date" th:field="*{nextServiceDueDate}" class="form-control">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Notes</label>
                                        <textarea th:field="*{notes}" class="form-control" rows="2" placeholder="Additional notes..."></textarea>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 mt-4">
                                    <a th:href="@{/vehicles/{id}(id=${vehicle.vehicleId})} + '?tab=service'" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Cancel</a>
                                    <button type="submit" class="btn btn-success ms-auto px-4">
                                        <i class="bi bi-check-circle me-1"></i><span th:text="${serviceId != null ? 'Update Record' : 'Save Record'}">Save</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
