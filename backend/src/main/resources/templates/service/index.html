<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Service Records — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <!-- Canonical Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: userSidebar('services')}"></div>
    <div class="main-content flex-grow-1">
        <div th:replace="~{fragments/topbar :: topbar('Service Records')}"></div>
        <div class="page-content px-4 pb-4">
            <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
                <div>
                    <h4 class="fw-bold mb-0">Cross-Vehicle Service History</h4>
                    <p class="text-muted small mb-0">Consolidated log of all maintenance, oil changes, and repairs across your entire garage.</p>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="text-muted small">Total Service Logs</div>
                        <div class="fs-4 fw-bold text-primary" th:text="${#lists.size(services)}">0</div>
                    </div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <div class="card border-0 shadow-sm p-3">
                        <div class="text-muted small">Total Service Expenditure</div>
                        <div class="fs-4 fw-bold text-success" th:text="'₹' + ${#numbers.formatDecimal(totalCost, 1, 2)}">₹0.00</div>
                    </div>
                </div>
            </div>

            <!-- Search Form -->
            <form method="get" th:action="@{/services}" class="row g-2 mb-4">
                <div class="col-md-6 col-lg-4">
                    <div class="input-group">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search service, garage, or vehicle...">
                        <button class="btn btn-outline-primary" type="submit"><i class="bi bi-search"></i> Search</button>
                        <a th:if="${search != null and !search.isBlank()}" th:href="@{/services}" class="btn btn-outline-secondary">Clear</a>
                    </div>
                </div>
            </form>

            <!-- Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Vehicle</th>
                                <th>Service Type</th>
                                <th>Garage / Provider</th>
                                <th>Odometer</th>
                                <th>Cost</th>
                                <th>Next Due</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(services)}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-3 d-block mb-1"></i>No service records found.
                                </td>
                            </tr>
                            <tr th:each="s : ${services}">
                                <td class="fw-semibold" th:text="${s.serviceDate}"></td>
                                <td>
                                    <span class="badge bg-secondary me-1" th:text="${s.vehicle?.plateNumber}"></span>
                                    <span class="small text-muted" th:text="${s.vehicle?.make + ' ' + s.vehicle?.model}"></span>
                                </td>
                                <td th:text="${s.serviceType}"></td>
                                <td class="text-muted" th:text="${s.garageName != null ? s.garageName : '—'}"></td>
                                <td th:text="${s.odometerAtService != null ? s.odometerAtService + ' km' : '—'}"></td>
                                <td class="fw-bold text-success" th:text="${s.cost != null ? '₹' + #numbers.formatDecimal(s.cost, 1, 2) : '—'}"></td>
                                <td>
                                    <span class="small text-muted" th:text="${s.nextServiceDueDate != null ? s.nextServiceDueDate : '—'}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/vehicles/{vid}(vid=${s.vehicle.vehicleId}, from='services')}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye"></i> View
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/mygarage.js"></script>
</body>
</html>
