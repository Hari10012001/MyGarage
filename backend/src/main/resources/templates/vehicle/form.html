<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${vehicleId != null ? 'Edit Vehicle' : 'Add Vehicle'} + ' — MyGarage'">Vehicle — MyGarage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/mygarage.css}">
</head>
<body>
<div class="d-flex">
    <div class="sidebar-overlay d-lg-none" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <nav id="sidebar" class="sidebar d-flex flex-column">
        <div class="sidebar-brand"><i class="bi bi-car-front-fill me-2"></i>MyGarage</div>
        <ul class="nav flex-column sidebar-nav flex-grow-1">
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link active" th:href="@{/vehicles}"><i class="bi bi-car-front"></i> My Vehicles</a></li>
            <li class="nav-item"><a class="nav-link sidebar-link" th:href="@{/profile}"><i class="bi bi-person-circle"></i> My Profile</a></li>
        </ul>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-left"></i> Logout</button></form>
        </div>
    </nav>
    <div class="main-content flex-grow-1">
        <nav class="topbar navbar navbar-light bg-white border-bottom px-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none me-3" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
            <span class="fw-semibold" th:text="${vehicleId != null ? 'Edit Vehicle' : 'Add New Vehicle'}">Vehicle</span>
            <div class="ms-auto"><i class="bi bi-person-circle me-2 text-primary"></i><span class="small text-muted" th:text="${user?.fullName}"></span></div>
        </nav>
        <div class="page-content px-4 pb-4">
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mt-3"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMsg}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <div class="row justify-content-center mt-4">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-0 pt-4 px-4">
                            <h5 class="fw-bold mb-0" th:text="${vehicleId != null ? '✏️ Edit Vehicle' : '🚗 Add New Vehicle'}">Vehicle</h5>
                            <p class="text-muted small mb-0" th:text="${vehicleId != null ? 'Update your vehicle details.' : 'Fill in the details to add a vehicle to your garage.'}">Fill details.</p>
                        </div>
                        <div class="card-body px-4 pb-4">
                            <form th:action="@{${vehicleId != null ? '/vehicles/' + vehicleId + '/edit' : '/vehicles/add'}}"
                                  th:object="${vehicleRequest}" method="post" novalidate>
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="row g-3">
                                    <!-- Plate Number -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Plate Number <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{plateNumber}" class="form-control text-uppercase"
                                               th:classappend="${#fields.hasErrors('plateNumber')} ? 'is-invalid'"
                                               placeholder="e.g. TN01AB1234">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('plateNumber')}" th:errors="*{plateNumber}"></div>
                                    </div>
                                    <!-- Category -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                                        <select th:field="*{categoryId}" class="form-select"
                                                th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                                            <option value="">— Select category —</option>
                                            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.icon + ' ' + cat.name}">Category</option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                                    </div>
                                    <!-- Make -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Make <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{make}" class="form-control"
                                               th:classappend="${#fields.hasErrors('make')} ? 'is-invalid'"
                                               placeholder="e.g. Honda, Maruti, TVS">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('make')}" th:errors="*{make}"></div>
                                    </div>
                                    <!-- Model -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Model <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{model}" class="form-control"
                                               th:classappend="${#fields.hasErrors('model')} ? 'is-invalid'"
                                               placeholder="e.g. City, Swift, Apache">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></div>
                                    </div>
                                    <!-- Year -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                                        <input type="number" th:field="*{year}" class="form-control"
                                               th:classappend="${#fields.hasErrors('year')} ? 'is-invalid'"
                                               min="1900" max="2030" placeholder="e.g. 2022">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
                                    </div>
                                    <!-- Color -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Color</label>
                                        <input type="text" th:field="*{color}" class="form-control" placeholder="e.g. White, Silver">
                                    </div>
                                    <!-- Fuel Type -->
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Fuel Type <span class="text-danger">*</span></label>
                                        <select th:field="*{fuelType}" class="form-select">
                                            <option value="">— Select —</option>
                                            <option value="PETROL">⛽ Petrol</option>
                                            <option value="DIESEL">⛽ Diesel</option>
                                            <option value="CNG">🔵 CNG</option>
                                            <option value="ELECTRIC">⚡ Electric</option>
                                            <option value="HYBRID">♻️ Hybrid</option>
                                            <option value="LPG">🔵 LPG</option>
                                            <option value="OTHER">Other</option>
                                        </select>
                                    </div>
                                    <!-- Odometer -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Current Odometer (km) <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="number" th:field="*{currentOdometer}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('currentOdometer')} ? 'is-invalid'"
                                                   min="0" placeholder="0">
                                            <span class="input-group-text">km</span>
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentOdometer')}" th:errors="*{currentOdometer}"></div>
                                    </div>
                                    <!-- Notes -->
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Notes</label>
                                        <textarea th:field="*{notes}" class="form-control" rows="2" placeholder="Any additional notes..."></textarea>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-4">
                                    <a th:href="@{/vehicles}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Cancel</a>
                                    <button type="submit" class="btn btn-primary ms-auto px-4">
                                        <i class="bi bi-check-circle me-1"></i>
                                        <span th:text="${vehicleId != null ? 'Update Vehicle' : 'Save Vehicle'}">Save</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/mygarage.js}"></script>
</body>
</html>
